# Lint, unit tests and a Docker build on every push and pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Unit tests never connect to MongoDB, Groq or Sentry; Settings only needs a syntactically valid URL
      DATABASE_URL: mongodb://localhost:27017
      GROQ_API_KEY: ""
      SENTRY_DSN: ""
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Unit tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Build only (no push): proves the image still builds with the pinned Python and requirements
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cliq-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
